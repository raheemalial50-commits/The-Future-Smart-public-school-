<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Notices • Future Smart Public School</title>
  <link rel="stylesheet" href="css/style.css" />
</head>
<body>
  <div id="sidebar-overlay" class="overlay" onclick="toggleSidebar()"></div>
  <aside id="sidebar" class="sidebar"></aside>
  <div class="main-content">
    <header id="topbar" class="topbar"></header>
    <main style="padding:1.5rem;">
      <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:1.5rem;">
        <h2 style="font-weight:700;color:var(--navy);">Notices & Announcements</h2>
        <button class="btn btn-primary" onclick="openNoticeModal()">+ Add Notice</button>
      </div>
      <div id="noticeList"></div>
    </main>
  </div>

  <div id="noticeModal" class="modal-overlay">
    <div class="modal">
      <div style="padding:1.25rem 1.5rem;border-bottom:1px solid var(--gray-200);display:flex;justify-content:space-between;align-items:center;">
        <h3 style="font-weight:700;color:var(--navy);">Add Notice</h3>
        <button onclick="closeNoticeModal()" style="background:none;border:none;font-size:1.5rem;cursor:pointer;">&times;</button>
      </div>
      <form id="noticeForm" style="padding:1.5rem;">
        <div style="margin-bottom:1rem;">
          <label class="form-label">Title *</label>
          <input type="text" id="nTitle" class="form-input" required />
        </div>
        <div style="margin-bottom:1rem;">
          <label class="form-label">Description</label>
          <textarea id="nDesc" class="form-input" rows="3"></textarea>
        </div>
        <div style="display:grid;grid-template-columns:1fr 1fr;gap:1rem;margin-bottom:1.25rem;">
          <div>
            <label class="form-label">Audience</label>
            <select id="nAudience" class="form-input">
              <option>Everyone</option>
              <option>Students</option>
              <option>Teachers</option>
              <option>Parents</option>
              <option>Staff</option>
            </select>
          </div>
          <div>
            <label class="form-label">Priority</label>
            <select id="nPriority" class="form-input">
              <option>High</option>
              <option>Medium</option>
              <option>Low</option>
            </select>
          </div>
        </div>
        <div style="display:flex;gap:0.75rem;justify-content:flex-end;">
          <button type="button" class="btn btn-outline" onclick="closeNoticeModal()">Cancel</button>
          <button type="submit" class="btn btn-primary">Publish Notice</button>
        </div>
      </form>
    </div>
  </div>

  <script src="js/storage.js"></script>
  <script src="js/auth.js"></script>
  <script src="js/app.js"></script>
  <script>
    initPage('notices', 'Notices & Announcements', 'School notices, circulars and events');

    function renderNotices() {
      const notices = Storage.get('notices');
      const list = document.getElementById('noticeList');
      if (!notices.length) {
        list.innerHTML = `<div class="card" style="padding:2.5rem;text-align:center;">
          <div style="font-size:2.5rem;">📢</div>
          <p style="margin:0.75rem 0;color:var(--gray-600);">No notices yet</p>
          <button class="btn btn-primary" onclick="openNoticeModal()">+ Add Notice</button>
        </div>`;
        return;
      }
      list.innerHTML = notices.map(n => `
        <div class="card" style="padding:1.25rem;margin-bottom:1rem;">
          <div style="display:flex;justify-content:space-between;align-items:flex-start;">
            <div>
              <h3 style="font-weight:700;color:var(--navy);">${n.title}</h3>
              <p style="font-size:0.85rem;color:var(--gray-600);margin-top:0.35rem;">
                ${formatDate(n.date)} • ${n.audience} • 
                <span style="color:${n.priority==='High'?'#dc2626':n.priority==='Medium'?'#d97706':'#16a34a'};font-weight:600;">
                  ${n.priority}
                </span>
              </p>
              ${n.description ? `<p style="margin-top:0.6rem;font-size:0.9rem;">${n.description}</p>` : ''}
            </div>
            <button class="btn btn-danger" style="padding:0.3rem 0.6rem;font-size:0.8rem;" onclick="deleteNotice('${n.id}')">Delete</button>
          </div>
        </div>
      `).join('');
    }

    function openNoticeModal() {
      document.getElementById('noticeModal').classList.add('active');
      document.getElementById('noticeForm').reset();
    }
    function closeNoticeModal() {
      document.getElementById('noticeModal').classList.remove('active');
    }
    function deleteNotice(id) {
      if (!confirm('Delete this notice?')) return;
      let list = Storage.get('notices').filter(n => n.id !== id);
      Storage.set('notices', list);
      toast('Notice deleted', 'success');
      renderNotices();
    }

    document.getElementById('noticeForm').addEventListener('submit', function(e) {
      e.preventDefault();
      const notices = Storage.get('notices');
      notices.unshift({
        id: Storage.generateId('NT'),
        title: document.getElementById('nTitle').value.trim(),
        description: document.getElementById('nDesc').value.trim(),
        audience: document.getElementById('nAudience').value,
        priority: document.getElementById('nPriority').value,
        date: new Date().toISOString().split('T')[0]
      });
      Storage.set('notices', notices);
      toast('Notice published', 'success');
      closeNoticeModal();
      renderNotices();
    });

    renderNotices();
  </script>
</body>
</html>
