<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Leave Management • Future Smart Public School</title>
  <link rel="stylesheet" href="css/style.css" />
</head>
<body>
  <div id="sidebar-overlay" class="overlay" onclick="toggleSidebar()"></div>
  <aside id="sidebar" class="sidebar"></aside>

  <div class="main-content">
    <header id="topbar" class="topbar"></header>

    <main style="padding:1.5rem;">
      <div style="display:grid;grid-template-columns:1fr;gap:1.5rem;" class="leave-grid">
        <!-- Form -->
        <div class="card" style="padding:1.5rem;">
          <h3 style="font-weight:700;color:var(--navy);margin-bottom:1.25rem;">Submit Leave Application</h3>
          
          <form id="leaveForm">
            <div style="display:grid;grid-template-columns:1fr 1fr;gap:1rem;margin-bottom:1rem;">
              <div>
                <label class="form-label">Applicant Name</label>
                <input type="text" id="applicant" class="form-input" required placeholder="Full name" />
              </div>
              <div>
                <label class="form-label">Type</label>
                <select id="leaveType" class="form-input" required>
                  <option value="Student">Student</option>
                  <option value="Teacher">Teacher</option>
                  <option value="Staff">Staff</option>
                </select>
              </div>
            </div>

            <div style="display:grid;grid-template-columns:1fr 1fr;gap:1rem;margin-bottom:1rem;">
              <div>
                <label class="form-label">Class / Department</label>
                <input type="text" id="leaveClass" class="form-input" placeholder="e.g. 9-A" />
              </div>
              <div>
                <label class="form-label">Leave Type</label>
                <select id="reasonType" class="form-input">
                  <option>Medical</option>
                  <option>Family</option>
                  <option>Personal</option>
                  <option>Other</option>
                </select>
              </div>
            </div>

            <div style="display:grid;grid-template-columns:1fr 1fr;gap:1rem;margin-bottom:1rem;">
              <div>
                <label class="form-label">From Date</label>
                <input type="date" id="fromDate" class="form-input" required />
              </div>
              <div>
                <label class="form-label">To Date</label>
                <input type="date" id="toDate" class="form-input" required />
              </div>
            </div>

            <div style="margin-bottom:1rem;">
              <label class="form-label">Reason</label>
              <textarea id="reason" class="form-input" rows="3" required placeholder="Explain the reason..."></textarea>
            </div>

            <!-- Mandatory Photo -->
            <div style="margin-bottom:1.25rem;">
              <label class="form-label">Supporting Picture / Document <span style="color:var(--danger);">*</span></label>
              <div id="photoUpload" style="border:2px dashed var(--gray-200);border-radius:1rem;padding:1.5rem;text-align:center;cursor:pointer;transition:border-color 0.2s;" onclick="document.getElementById('photoInput').click()">
                <div id="photoPreview" style="display:none;">
                  <img id="previewImg" style="max-height:140px;border-radius:0.5rem;margin-bottom:0.5rem;" />
                  <p id="fileName" style="font-size:0.85rem;color:var(--gray-600);"></p>
                  <button type="button" onclick="event.stopPropagation();clearPhoto()" style="font-size:0.8rem;color:var(--danger);background:none;border:none;cursor:pointer;margin-top:0.35rem;">Remove</button>
                </div>
                <div id="photoPlaceholder">
                  <div style="font-size:2rem;margin-bottom:0.5rem;">📷</div>
                  <p style="font-weight:600;font-size:0.9rem;">Click to upload photo or document</p>
                  <p style="font-size:0.75rem;color:var(--gray-600);margin-top:0.25rem;">Medical certificate, letter, etc. (JPG, PNG, PDF)</p>
                </div>
              </div>
              <input type="file" id="photoInput" accept="image/*,.pdf" style="display:none;" />
            </div>

            <button type="submit" class="btn btn-primary" style="width:100%;padding:0.85rem;">Submit Leave Application</button>
          </form>
        </div>

        <!-- List -->
        <div class="card" style="padding:1.5rem;">
          <h3 style="font-weight:700;color:var(--navy);margin-bottom:1rem;">Leave Applications</h3>
          <div id="leaveList"></div>
        </div>
      </div>
    </main>
  </div>

  <script src="js/storage.js"></script>
  <script src="js/auth.js"></script>
  <script src="js/app.js"></script>
  <script>
    initPage('leave', 'Leave Management', 'Apply for leave with supporting photo • Approval workflow');

    let selectedPhoto = null;

    document.getElementById('photoInput').addEventListener('change', function(e) {
      const file = e.target.files[0];
      if (!file) return;
      selectedPhoto = file;
      const reader = new FileReader();
      reader.onload = function(ev) {
        document.getElementById('photoPlaceholder').style.display = 'none';
        document.getElementById('photoPreview').style.display = 'block';
        document.getElementById('previewImg').src = ev.target.result;
        document.getElementById('fileName').textContent = file.name;
      };
      reader.readAsDataURL(file);
    });

    function clearPhoto() {
      selectedPhoto = null;
      document.getElementById('photoInput').value = '';
      document.getElementById('photoPlaceholder').style.display = 'block';
      document.getElementById('photoPreview').style.display = 'none';
    }

    document.getElementById('leaveForm').addEventListener('submit', function(e) {
      e.preventDefault();
      if (!selectedPhoto) {
        toast('Please upload a supporting picture or document', 'error');
        return;
      }

      const leaves = Storage.get('leaves');
      leaves.unshift({
        id: Storage.generateId('LV'),
        applicant: document.getElementById('applicant').value,
        type: document.getElementById('leaveType').value,
        class: document.getElementById('leaveClass').value,
        from: document.getElementById('fromDate').value,
        to: document.getElementById('toDate').value,
        reason: document.getElementById('reason').value,
        status: 'Pending',
        photo: true,
        appliedOn: new Date().toISOString().split('T')[0]
      });
      Storage.set('leaves', leaves);

      toast('Leave application submitted successfully', 'success');
      document.getElementById('leaveForm').reset();
      clearPhoto();
      loadLeaves();
    });

    function loadLeaves() {
      const leaves = Storage.get('leaves');
      const container = document.getElementById('leaveList');

      if (!leaves.length) {
        container.innerHTML = '<p style="text-align:center;color:var(--gray-600);padding:2rem;">No leave applications yet</p>';
        return;
      }

      container.innerHTML = leaves.map(l => `
        <div style="padding:1rem;background:var(--gray-50);border-radius:0.75rem;margin-bottom:0.75rem;">
          <div style="display:flex;justify-content:space-between;align-items:flex-start;margin-bottom:0.35rem;">
            <div style="font-weight:600;">${l.applicant}</div>
            <span class="badge badge-${l.status.toLowerCase()}">${l.status}</span>
          </div>
          <div style="font-size:0.8rem;color:var(--gray-600);">${l.type} • ${l.class || '-'} • ${formatDate(l.from)} → ${formatDate(l.to)}</div>
          <div style="font-size:0.85rem;margin-top:0.35rem;">${l.reason}</div>
          ${l.photo ? '<div style="font-size:0.75rem;color:#2563eb;margin-top:0.35rem;">📎 Photo attached</div>' : ''}
          ${l.status === 'Pending' && Auth.hasRole('admin','principal','teacher') ? `
            <div style="margin-top:0.75rem;display:flex;gap:0.5rem;">
              <button onclick="updateLeave('${l.id}','Approved')" class="btn btn-success" style="padding:0.35rem 0.75rem;font-size:0.8rem;">Approve</button>
              <button onclick="updateLeave('${l.id}','Rejected')" class="btn btn-danger" style="padding:0.35rem 0.75rem;font-size:0.8rem;">Reject</button>
            </div>
          ` : ''}
        </div>
      `).join('');
    }

    function updateLeave(id, status) {
      const leaves = Storage.get('leaves');
      const idx = leaves.findIndex(l => l.id === id);
      if (idx > -1) {
        leaves[idx].status = status;
        Storage.set('leaves', leaves);
        toast(`Leave ${status.toLowerCase()}`, status === 'Approved' ? 'success' : 'warning');
        loadLeaves();
      }
    }

    loadLeaves();
  </script>
</body>
</html>
