<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Settings • Future Smart Public School</title>
  <link rel="stylesheet" href="css/style.css" />
</head>
<body>
  <div id="sidebar-overlay" class="overlay" onclick="toggleSidebar()"></div>
  <aside id="sidebar" class="sidebar"></aside>
  <div class="main-content">
    <header id="topbar" class="topbar"></header>
    <main style="padding:1.5rem;max-width:640px;">
      <div class="card" style="padding:1.5rem;">
        <h3 style="font-weight:700;color:var(--navy);margin-bottom:1.25rem;">School Profile</h3>
        <form id="settingsForm">
          <div style="margin-bottom:1rem;">
            <label class="form-label">School Name</label>
            <input type="text" id="schoolName" class="form-input" />
          </div>
          <div style="margin-bottom:1rem;">
            <label class="form-label">Slogan</label>
            <input type="text" id="slogan" class="form-input" />
          </div>
          <div style="margin-bottom:1rem;">
            <label class="form-label">WhatsApp Number</label>
            <input type="text" id="whatsapp" class="form-input" />
          </div>
          <div style="margin-bottom:1rem;">
            <label class="form-label">Address</label>
            <input type="text" id="address" class="form-input" />
          </div>
          <div style="margin-bottom:1.25rem;">
            <label class="form-label">Academic Session</label>
            <input type="text" id="session" class="form-input" />
          </div>
          <button type="submit" class="btn btn-primary">Save Changes</button>
        </form>
      </div>
    </main>
  </div>
  <script src="js/storage.js"></script>
  <script src="js/auth.js"></script>
  <script src="js/app.js"></script>
  <script>
    initPage('settings', 'Settings', 'School profile & system preferences');
    const settings = Storage.get('settings', {});
    document.getElementById('schoolName').value = settings.schoolName || '';
    document.getElementById('slogan').value = settings.slogan || '';
    document.getElementById('whatsapp').value = settings.whatsapp || '03304886710';
    document.getElementById('address').value = settings.address || '';
    document.getElementById('session').value = settings.session || '';

    document.getElementById('settingsForm').addEventListener('submit', function(e) {
      e.preventDefault();
      Storage.set('settings', {
        schoolName: document.getElementById('schoolName').value,
        slogan: document.getElementById('slogan').value,
        whatsapp: document.getElementById('whatsapp').value,
        address: document.getElementById('address').value,
        session: document.getElementById('session').value,
        currency: 'PKR'
      });
      toast('Settings saved successfully', 'success');
    });
  </script>
</body>
</html>
