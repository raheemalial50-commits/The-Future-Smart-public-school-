<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Teachers • Future Smart Public School</title>
  <link rel="stylesheet" href="css/style.css" />
</head>
<body>
  <div id="sidebar-overlay" class="overlay" onclick="toggleSidebar()"></div>
  <aside id="sidebar" class="sidebar"></aside>
  <div class="main-content">
    <header id="topbar" class="topbar"></header>
    <main style="padding:1.5rem;">
      <div style="display:grid;grid-template-columns:repeat(auto-fill,minmax(260px,1fr));gap:1.25rem;" id="teacherGrid"></div>
    </main>
  </div>
  <script src="js/storage.js"></script>
  <script src="js/auth.js"></script>
  <script src="js/app.js"></script>
  <script>
    initPage('teachers', 'Teachers', 'Teaching staff');
    const teachers = Storage.get('teachers');
    document.getElementById('teacherGrid').innerHTML = teachers.map(t => `
      <div class="card" style="padding:1.25rem;">
        <div style="width:48px;height:48px;border-radius:50%;background:var(--navy);color:white;display:flex;align-items:center;justify-content:center;font-weight:700;margin-bottom:0.75rem;">
          ${t.name.split(' ').map(n=>n[0]).join('').slice(0,2)}
        </div>
        <h3 style="font-weight:700;color:var(--navy);">${t.name}</h3>
        <p style="font-size:0.9rem;color:var(--gray-600);margin-top:0.25rem;">${t.subject}</p>
        <p style="font-size:0.8rem;color:var(--gray-600);margin-top:0.5rem;">Classes: ${t.classes}</p>
        <p style="font-size:0.8rem;color:var(--gray-600);">${t.phone}</p>
      </div>
    `).join('');
  </script>
</body>
</html>
